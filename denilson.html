<div id="wel"><div class="wb"><svg id="wi" viewBox="-2.6 -2.6 5.2 5.2" aria-label="Círculo trigonométrico animado"></svg><div id="wc"></div><div class="lg"><span><i style="background:#0396FE"></i>ponto que gira</span><span><i style="background:#0369B3"></i>cosseno = x</span><span><i style="background:#5FB13E"></i>seno = y</span><span><i style="background:#36E473"></i>ângulo θ (arco)</span></div></div><div class="wf"><h1>Bem-vindo ao Universo da Trigonometria</h1><p>Explore os ângulos, descubra as funções e visualize a matemática em movimento.</p>
<button class="pri" id="go">Começar a explorar</button></div></div>
<div id="app"><header><b>Universo da Trigonometria</b><span id="sc"></span><span class="sp"></span><span id="gr"></span><button id="hm">Início</button><button id="th">Modo escuro</button></header><nav id="nv"></nav><main id="mn"></main></div>
<script>
const $=s=>document.querySelector(s),P=Math.PI,T=2*P,mn=$('#mn');
const F={sin:Math.sin,cos:Math.cos,tan:Math.tan,cot:x=>1/Math.tan(x),sec:x=>1/Math.cos(x),csc:x=>1/Math.sin(x)};
const N={sin:'sen',cos:'cos',tan:'tg',cot:'cotg',sec:'sec',csc:'cossec'};
const CL={sin:'#5FB13E',cos:'#0369B3',tan:'#0396FE',cot:'#4A6C76',sec:'#36E473',csc:'#4A6C76'},DS={sec:'6 4',csc:'6 4'};
const AS={tan:[P/2,P],sec:[P/2,P],cot:[0,P],csc:[0,P]};
const S={a:P/6,fns:['sin','cos'],sh:{sin:1,cos:1,tan:0,cot:0,sec:0,csc:0,proj:1,aux:1,val:1},cx:P,cy:0,sc:70,name:''};
const g=(a,b)=>b?g(b,a%b):a,md=(a,m)=>((a%m)+m)%m,R=a=>a[Math.random()*a.length|0];
const fm=v=>isFinite(v)&&Math.abs(v)<1e6?(+v.toFixed(4)+'').replace('.',','):'Não definida';
function V(n,a){const c=Math.cos(a),s=Math.sin(a);if((n=='tan'||n=='sec')&&Math.abs(c)<1e-9||(n=='cot'||n=='csc')&&Math.abs(s)<1e-9)return NaN;return F[n](a)}
function rl(d){d=Math.round(d);if(!d)return'0';const k=g(Math.abs(d),180),n=d/k,m=180/k,p=n==1?'π':n==-1?'−π':(n+'').replace('-','−')+'π';return m==1?p:p+'/'+m}
const EX={0:['0','1'],30:['1/2','√3/2'],45:['√2/2','√2/2'],60:['√3/2','1/2'],90:['1','0']},TX={0:'0',30:'√3/3',45:'1',60:'√3'};
const sg=(t,n)=>t=='0'?t:(n?'−':'')+t;
function ex(deg){const r=Math.round(deg);if(Math.abs(deg-r)>1e-6)return null;const d=md(r,360),q=d<=90?d:d<=180?180-d:d<=270?d-180:360-d;if(!(q in EX))return null;const sn=d>180,cn=d>90&&d<270;return{sin:sg(EX[q][0],sn),cos:sg(EX[q][1],cn),tan:q==90?'Não definida':sg(TX[q],sn!=cn)}}
const quad=a=>{const d=md(a*180/P,360);return Math.abs(d%90)<1e-6||Math.abs(d%90-90)<1e-6?'Sobre o eixo':['I','II','III','IV'][Math.floor(d/90)]+' quadrante'};
// ---------- círculo ----------
function dc(a,o={}){const sh=o.sh||S.sh,c=Math.cos(a),s=Math.sin(a),t=V('tan',a),k=V('cot',a),Z=v=>Math.max(-40,Math.min(40,v));let h='';
const L=(x1,y1,x2,y2,col,w=.03,d)=>`<line x1="${x1}" y1="${-y1}" x2="${x2}" y2="${-y2}" stroke="${col}" stroke-width="${w}" ${d?`stroke-dasharray="${d}"`:''} stroke-linecap="round"/>`;
const X=(x,y,t,sz=.13,col='var(--mu)',an='middle')=>`<text x="${x}" y="${-y}" font-size="${sz}" fill="${col}" text-anchor="${an}">${t}</text>`;
h+=`<line x1="-2.5" x2="2.5" y1="0" y2="0" stroke="var(--mu)" stroke-width=".02"/><line y1="-2.5" y2="2.5" x1="0" x2="0" stroke="var(--mu)" stroke-width=".02"/>${X(2.45,.14,'x')}${X(.12,2.4,'y')}${X(-.12,-.1,'O(0,0)',.11)}<circle r="1" fill="rgba(3,150,254,.05)" stroke="var(--b1)" stroke-width=".035"/>`;
[['I',.55,.55],['II',-.55,.55],['III',-.55,-.55],['IV',.55,-.55]].forEach(q=>h+=X(q[1],q[2]-.04,q[0],.2,'var(--bd)'));
if(!o.min)for(let d=0;d<360;d+=30){[45,135,225,315].includes(d)||0;h+=''}
const ds=o.min?[0,90,180,270]:[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330];
ds.forEach(d=>{const r=d*P/180,cc=Math.cos(r),ss=Math.sin(r);h+=L(cc*.96,ss*.96,cc*1.04,ss*1.04,'var(--mu)',.02)+X(cc*1.2,ss*1.2-.04,d+'°',.105,'var(--tx)')+X(cc*1.42,ss*1.42-.04,rl(d),.09,'var(--b1)')});
if(sh.aux&&!o.min){if(Math.abs(c)>1e-9)h+=L(1,-3,1,3,'var(--bd)',.012);if(Math.abs(s)>1e-9)h+=L(-3,1,3,1,'var(--bd)',.012);h+=L(-c*3,-s*3,c*3,s*3,'var(--bd)',.012)}
if(o.guide)h+=o.guide;
const w=a%T,ar=.3;h+=`<path d="M${ar} 0 A${ar} ${ar} 0 ${Math.abs(w)>P?1:0} ${w>=0?0:1} ${ar*Math.cos(w)} ${-ar*Math.sin(w)}" fill="rgba(54,228,115,.25)" stroke="var(--g1)" stroke-width=".03"/>`;
h+=L(0,0,c,s,'var(--tx)',.03);
if(sh.proj){h+=L(c,s,0,s,'var(--sl)',.018,'.05 .04')+L(c,s,c,0,'var(--sl)',.018,'.05 .04')}
if(sh.cos)h+=L(0,0,c,0,CL.cos,.055);if(sh.sin)h+=L(c,0,c,s,CL.sin,.055);
if(sh.tan&&isFinite(t))h+=L(1,0,1,Z(t),CL.tan,.05);if(sh.sec&&isFinite(t))h+=L(0,0,1,Z(t),CL.sec,.035,'.09 .06');
if(sh.cot&&isFinite(k))h+=L(0,1,Z(k),1,CL.cot,.05);if(sh.csc&&isFinite(k))h+=L(0,0,Z(k),1,CL.csc,.035,'.09 .06');
if(sh.val){if(sh.sin)h+=X(c+(c>=0?.05:-.05),s/2,fm(s),.12,CL.sin,c>=0?'start':'end');if(sh.cos)h+=X(c/2,s>=0?-.08:.17,fm(c),.12,CL.cos);if(sh.tan&&Math.abs(t)<2.4)h+=X(1.05,Z(t)/2,fm(t),.12,CL.tan,'start')}
(o.pts||[]).forEach(p=>h+=`<circle cx="${Math.cos(p)}" cy="${-Math.sin(p)}" r=".055" fill="var(--g2)" stroke="var(--b1)" stroke-width=".02"/>`+X(Math.cos(p)*1.0+.06,-Math.sin(p)*1.0+.0,'',0));
h+=`<circle cx="${c}" cy="${-s}" r=".07" fill="var(--b2)" stroke="#fff" stroke-width=".02"/>`+X(c>=0?c+.1:c-.1,s>=0?s+.1:s-.05,`(${fm(c)}; ${fm(s)})`,.11,'var(--tx)',c>=0?'start':'end');return h}
function svgDrag(el,fn){let on=0;const m=e=>{const p=el.createSVGPoint();p.x=e.clientX;p.y=e.clientY;fn(p.matrixTransform(el.getScreenCTM().inverse()))};el.onpointerdown=e=>{on=1;el.setPointerCapture(e.pointerId);m(e)};el.onpointermove=e=>{if(on)m(e)};el.onpointerup=()=>on=0}
const circDrag=(el,cb)=>svgDrag(el,q=>{S.a=md(Math.atan2(-q.y,q.x),T);cb()});
// ---------- gráfico ----------
const mk=n=>({n,f:F[n],c:CL[n],d:DS[n],as:AS[n],dots:1});
function gr(fns,a,pts=1){const W=720,H=320,ys=58,X=x=>W/2+(x-S.cx)*S.sc,Y=y=>H/2-(y-S.cy)*ys,x0=S.cx-W/2/S.sc,x1=S.cx+W/2/S.sc;let h='';
for(let k=Math.ceil(x0/(P/2));k<=x1/(P/2);k++){const px=X(k*P/2);h+=`<line x1="${px}" x2="${px}" y2="${H}" stroke="var(--bd)" stroke-width="${k%2?.6:1}"/>`;if(S.sc>28||k%2==0)h+=`<text x="${px+3}" y="${H-16}" font-size="10" fill="var(--mu)">${k?rl(k*90):'0'}</text><text x="${px+3}" y="${H-5}" font-size="9" fill="var(--mu)">${k*90}°</text>`}
for(let y=-4;y<=4;y++){h+=`<line y1="${Y(y)}" y2="${Y(y)}" x2="${W}" stroke="var(--bd)" stroke-width=".7"/><text x="3" y="${Y(y)-3}" font-size="10" fill="var(--mu)">${y}</text>`}
h+=`<line x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tx)" stroke-width="1.2"/><line x1="${X(0)}" x2="${X(0)}" y2="${H}" stroke="var(--tx)" stroke-width="1.2"/>`;
fns.forEach(o=>{if(o.as)for(let k=Math.floor((x0-o.as[0])/o.as[1]);o.as[0]+k*o.as[1]<=x1;k++)h+=`<line x1="${X(o.as[0]+k*o.as[1])}" x2="${X(o.as[0]+k*o.as[1])}" y2="${H}" stroke="${o.c}" stroke-dasharray="4 4" opacity=".6"/>`;
let d='',pv=null;for(let px=0;px<=W;px+=2){const x=x0+px/S.sc,y=o.f(x);if(!isFinite(y)||Math.abs(y)>9){pv=null;continue}d+=(pv===null||Math.abs(y-pv)>3?'M':'L')+px+' '+Y(y).toFixed(1);pv=y}
h+=`<path d="${d}" fill="none" stroke="${o.c}" stroke-width="2.6" ${o.d?`stroke-dasharray="${o.d}"`:''}/>`;
if(o.dots)for(let k=Math.ceil(x0/(P/2));k<=x1/(P/2);k++){const x=k*P/2,y=o.f(x);if(isFinite(y)&&Math.abs(y)<1.001&&Math.abs(y)>-1)h+=`<circle cx="${X(x)}" cy="${Y(y)}" r="3.5" fill="${o.c}" stroke="#fff"/>`}});
if(a!=null)for(let k=-3;k<=3;k++){const x=a+k*T;if(x<x0||x>x1)continue;h+=`<line x1="${X(x)}" x2="${X(x)}" y1="${Y(0)}" y2="${H*(k?.0:1)*0+0||0}" stroke="none"/>`;fns.forEach(o=>{const y=o.n?V(o.n,x):o.f(x);if(isFinite(y)&&Math.abs(y)<9)h+=`<line x1="${X(x)}" x2="${X(x)}" y1="${Y(0)}" y2="${Y(y)}" stroke="${o.c}" stroke-dasharray="3 3"/><circle cx="${X(x)}" cy="${Y(y)}" r="6" fill="var(--b2)" stroke="#fff" stroke-width="2"/>`})}
return h}
function gMount(el,cu,getF,onA){const upd=()=>el.innerHTML=gr(getF(),S.a);const pos=e=>{const p=el.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(el.getScreenCTM().inverse());return[S.cx+(q.x-360)/S.sc,S.cy-(q.y-160)/58]};let on=0;
el.onpointerdown=e=>{on=1;el.setPointerCapture(e.pointerId);mv(e,1)};el.onpointermove=e=>mv(e,on);el.onpointerup=()=>on=0;
function mv(e,d){const[x,y]=pos(e);if(cu){const f=getF()[0],v=f.n?V(f.n,x):f.f(x);cu.textContent=`x = ${fm(x)} rad = ${fm(x*180/P)}° ; y = ${fm(v)}`}if(d&&onA){S.a=md(x,T);onA()}}
el.onwheel=e=>{e.preventDefault();S.sc=Math.max(15,Math.min(250,S.sc*(e.deltaY<0?1.1:.9)));upd()};return upd}
const gBtns=id=>`<div class="row" id="${id}"><button data-z="1.25">＋</button><button data-z=".8">−</button><button data-x="-1">←</button><button data-x="1">→</button><button data-y="1">↑</button><button data-y="-1">↓</button><button data-r="1">Reiniciar</button></div>`;
function gWire(id,upd){$('#'+id).onclick=e=>{const d=e.target.dataset;if(d.z)S.sc=Math.max(15,Math.min(250,S.sc*d.z));if(d.x)S.cx+=d.x*1;if(d.y)S.cy+=d.y*.5;if(d.r){S.cx=P;S.cy=0;S.sc=70}upd()}}
// ---------- laboratório ----------
const INFO={sin:['ℝ','[−1, 1]','2π','x = kπ','nenhuma','ímpar: sen(−x) = −sen x'],cos:['ℝ','[−1, 1]','2π','x = π/2 + kπ','nenhuma','par: cos(−x) = cos x'],tan:['x ≠ π/2 + kπ','ℝ','π','x = kπ','x = π/2 + kπ','ímpar'],cot:['x ≠ kπ','ℝ','π','x = π/2 + kπ','x = kπ','ímpar'],sec:['x ≠ π/2 + kπ','(−∞,−1] ∪ [1,∞)','2π','nenhum','x = π/2 + kπ','par'],csc:['x ≠ kπ','(−∞,−1] ∪ [1,∞)','2π','nenhum','x = kπ','ímpar']};
let raf=0;
function lab(pre){S.fns=[...pre];mn.innerHTML=`<div class="lab"><div><div class="card"><svg id="cv" viewBox="-2.6 -2.6 5.2 5.2"></svg><input id="sl" type="range" min="0" max="360" step="1" aria-label="Ângulo"><div class="row"><button id="pl">▶ Animar</button><span style="color:var(--mu)">Arraste o ponto ou use o controle.</span></div><div class="chips" id="tg"></div></div></div><div><div class="card" id="pn"></div><div class="card"><div class="chips" id="fc"></div><svg id="gv" viewBox="0 0 720 320"></svg><div id="cu" style="color:var(--mu);min-height:22px">Passe o cursor sobre o gráfico.</div>${gBtns('gb')}<div id="ig"></div></div></div></div>`;
const tg=[['sin','sen'],['cos','cos'],['tan','tg'],['cot','cotg'],['sec','sec'],['csc','cossec'],['proj','Projeções'],['aux','Linhas auxiliares'],['val','Valores']];
const drawT=()=>{$('#tg').innerHTML=tg.map(t=>`<button data-k="${t[0]}" class="${S.sh[t[0]]?'on':''}">${t[1]}</button>`).join('');$('#fc').innerHTML='Gráficos: '+Object.keys(F).map(n=>`<button data-f="${n}" class="${S.fns.includes(n)?'on':''}" style="${S.fns.includes(n)?'':'border-color:'+CL[n]}">${N[n]}</button>`).join('')};
const gu=gMount($('#gv'),$('#cu'),()=>S.fns.map(mk),()=>upd());
function upd(){const a=S.a,d=a*180/P,e=ex(d);$('#cv').innerHTML=dc(a);$('#sl').value=md(d,360)>359.5&&d<360?0:md(d,360);gu();
const row=(l,v,c)=>`<div class="val"><span style="color:${c||'inherit'}">${l}</span><b>${v}</b></div>`;
$('#pn').innerHTML=row('Ângulo',fm(d)+'°')+row('Radianos',(e||Math.abs(d-Math.round(d))<1e-9?rl(d)+' ≈ ':'')+fm(a)+' rad')+row('Quadrante',quad(a))+['sin','cos','tan','sec','csc','cot'].map(n=>{const v=V(n,a);return row(N[n]+'(θ)'+(n=='sin'?' = y':n=='cos'?' = x':''),(e&&e[n]?e[n]+' ≈ ':'')+fm(v),CL[n])}).join('');
const f=INFO[S.fns[0]];$('#ig').innerHTML=`<div style="color:var(--mu);font-size:13px">${N[S.fns[0]]}(x): domínio ${f[0]} · imagem ${f[1]} · período ${f[2]} · zeros ${f[3]} · assíntotas ${f[4]}</div>`}
$('#sl').oninput=e=>{S.a=e.target.value*P/180;upd()};circDrag($('#cv'),upd);
$('#tg').onclick=e=>{const k=e.target.dataset.k;if(k){S.sh[k]^=1;drawT();upd()}};
$('#fc').onclick=e=>{const k=e.target.dataset.f;if(!k)return;const i=S.fns.indexOf(k);if(i>=0){if(S.fns.length>1)S.fns.splice(i,1)}else S.fns.unshift(k);drawT();upd()};
gWire('gb',upd);cancelAnimationFrame(raf);$('#pl').onclick=e=>{if(e.target.dataset.on){e.target.dataset.on='';e.target.textContent='▶ Animar';return}e.target.dataset.on=1;e.target.textContent='❚❚ Pausar';const b=e.target,st=()=>{if(!b.dataset.on||!b.isConnected)return;S.a=md(S.a+.012,T);upd();raf=requestAnimationFrame(st)};st()};
drawT();upd()}
// ---------- triângulo ----------
